name: Update phosphor icons

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: pnpm install

      - name: Update @phosphor-icons/core and regenerate artifacts
        run: pnpm update-phosphor

      - name: Detect changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version, commit, and publish
        if: steps.changes.outputs.changed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm build
          pnpm --filter phosphor-vector-icons exec npm version patch --no-git-tag-version
          git add -A
          git commit -m "chore: update phosphor icons"
          git push

          version=$(node -p "require('./packages/phosphor-icons/package.json').version")
          pkg="phosphor-vector-icons@${version}"

          if npm view "$pkg" version >/dev/null 2>&1; then
            echo "$pkg is already on npm. Skipping publish."
            exit 0
          fi

          set +e
          publish_out=$(pnpm --filter phosphor-vector-icons publish --no-git-checks 2>&1)
          publish_code=$?
          set -e
          printf '%s\n' "$publish_out"

          if [ "$publish_code" -eq 0 ]; then
            :
          elif printf '%s' "$publish_out" | grep -q 'Cannot publish over previously staged version'; then
            echo "$pkg was already staged. Waiting for it to become visible..."
          else
            exit "$publish_code"
          fi

          for i in $(seq 1 20); do
            if npm view "$pkg" version >/dev/null 2>&1; then
              echo "$pkg is live on npm."
              exit 0
            fi
            echo "not visible yet ($i/20); sleeping 30s..."
            sleep 30
          done

          echo "Timed out waiting for $pkg to become visible on npm."
          exit 1
