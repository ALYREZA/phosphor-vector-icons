name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish phosphor-vector-icons
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./packages/phosphor-icons/package.json').version")
          if npm view "phosphor-vector-icons@${version}" version >/dev/null 2>&1; then
            echo "phosphor-vector-icons@${version} is already on npm. Skipping publish."
            exit 0
          fi
          pnpm --filter phosphor-vector-icons publish --no-git-checks
